<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" width="400" height="530">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0035;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d0055;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8962e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1a0035;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="530" fill="url(#bgGrad)" rx="20"/>

  <!-- Glow effect -->
  <ellipse cx="200" cy="200" rx="180" ry="200" fill="url(#glowGrad)"/>

  <!-- Stars -->
  <circle cx="50" cy="60" r="1.5" fill="#d4af37" opacity="0.8" filter="url(#glow)"/>
  <circle cx="120" cy="30" r="1" fill="#a855f7" opacity="0.7"/>
  <circle cx="280" cy="45" r="1.5" fill="#d4af37" opacity="0.6"/>
  <circle cx="350" cy="80" r="1" fill="#a855f7" opacity="0.8"/>
  <circle cx="30" cy="150" r="1" fill="#d4af37" opacity="0.5"/>
  <circle cx="370" cy="200" r="1.5" fill="#d4af37" opacity="0.7"/>
  <circle cx="20" cy="350" r="1" fill="#a855f7" opacity="0.6"/>
  <circle cx="380" cy="400" r="1" fill="#d4af37" opacity="0.5"/>
  <circle cx="60" cy="450" r="1.5" fill="#a855f7" opacity="0.4"/>
  <circle cx="340" cy="480" r="1" fill="#d4af37" opacity="0.6"/>

  <!-- Moon crescent -->
  <g transform="translate(185, 55)">
    <circle cx="15" cy="15" r="22" fill="#d4af37" opacity="0.9" filter="url(#glow)"/>
    <circle cx="24" cy="9" r="18" fill="#1a0035"/>
  </g>

  <!-- Mystical circle frame -->
  <circle cx="200" cy="220" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.5"/>
  <circle cx="200" cy="220" r="140" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.3"/>

  <!-- Silhouette body -->
  <ellipse cx="200" cy="185" rx="58" ry="68" fill="#3a0068" opacity="0.9"/>
  <!-- Head -->
  <ellipse cx="200" cy="155" rx="42" ry="48" fill="#4a0078"/>
  <!-- Hair flowing -->
  <ellipse cx="200" cy="158" rx="50" ry="52" fill="#2d0055"/>
  <ellipse cx="165" cy="185" rx="20" ry="40" fill="#2d0055"/>
  <ellipse cx="235" cy="185" rx="20" ry="40" fill="#2d0055"/>
  <!-- Face subtle highlight -->
  <ellipse cx="200" cy="155" rx="32" ry="36" fill="#5a0088" opacity="0.7"/>

  <!-- Third eye symbol -->
  <ellipse cx="200" cy="148" rx="10" ry="6" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.8"/>
  <circle cx="200" cy="148" r="3" fill="#d4af37" opacity="0.7" filter="url(#glow)"/>

  <!-- Shoulders/robe -->
  <ellipse cx="200" cy="245" rx="80" ry="45" fill="#2d0055"/>
  <ellipse cx="200" cy="260" rx="95" ry="55" fill="#1e0040"/>

  <!-- Stars on robe -->
  <text x="165" y="265" font-size="12" fill="#d4af37" opacity="0.6" filter="url(#glow)">✦</text>
  <text x="215" y="255" font-size="10" fill="#a855f7" opacity="0.5">✦</text>
  <text x="235" y="272" font-size="8" fill="#d4af37" opacity="0.4">✦</text>

  <!-- Crystal ball in hands -->
  <circle cx="200" cy="310" r="28" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="310" r="24" fill="#150030" opacity="0.8"/>
  <circle cx="200" cy="310" r="20" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.4"/>
  <circle cx="191" cy="302" r="5" fill="#a855f7" opacity="0.3"/>
  <circle cx="191" cy="302" r="2" fill="#d4af37" opacity="0.4" filter="url(#glow)"/>

  <!-- Ornamental divider -->
  <line x1="80" y1="380" x2="155" y2="380" stroke="#d4af37" stroke-width="0.8" opacity="0.4"/>
  <circle cx="165" cy="380" r="3" fill="#d4af37" opacity="0.5"/>
  <line x1="175" y1="380" x2="225" y2="380" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
  <circle cx="235" cy="380" r="3" fill="#d4af37" opacity="0.5"/>
  <line x1="245" y1="380" x2="320" y2="380" stroke="#d4af37" stroke-width="0.8" opacity="0.4"/>

  <!-- Name text -->
  <text x="200" y="420" font-family="serif" font-size="22" fill="#d4af37" text-anchor="middle" letter-spacing="4" opacity="0.9" filter="url(#glow)">MARÍA</text>
  <text x="200" y="448" font-family="serif" font-size="16" fill="#a855f7" text-anchor="middle" letter-spacing="6" opacity="0.8">JACARANDA</text>

  <!-- Subtitle -->
  <text x="200" y="475" font-family="sans-serif" font-size="9" fill="#9d8ab5" text-anchor="middle" letter-spacing="3">VIDENTE · ASTRÓLOGA · 30 AÑOS</text>

  <!-- Bottom ornament -->
  <text x="200" y="505" font-family="serif" font-size="14" fill="#d4af37" text-anchor="middle" opacity="0.4">✦ ✦ ✦</text>
</svg>
